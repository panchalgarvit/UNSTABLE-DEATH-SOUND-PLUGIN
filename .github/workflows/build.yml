name: Build plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o DeathEffects.zip

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build with Maven
        run: mvn -B -f DeathEffects/pom.xml package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: DeathEffects-jar
          path: DeathEffects/target/*.jar
